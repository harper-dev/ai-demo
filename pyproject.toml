[project]
name = "ai-demo"
version = "0.1.0"
description = "A demo project for AI applications."
authors = ["Your Name <you@example.com>"]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipython>=9.13.0",
    "langchain>=1.3.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "langgraph-api>=0.8.7",
    "tavily>=1.1.0",
]


[tool]

[tool.poetry]
name = "ai-demo"
version = "0.1.0"
description = "A demo project for AI applications."
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
aiohappyeyeballs = "2.6.1"
aiohttp = "3.13.2"
aiosignal = "1.4.0"
aiosqlite = "0.22.0"
annotated-types = "0.7.0"
anthropic = "0.75.0"
anyio = "4.12.0"
asyncio = "4.0.0"
attrs = "25.4.0"
banks = "2.2.0"
beautifulsoup4 = "4.14.3"
blockbuster = "1.5.26"
bracex = "2.6"
bs4 = "0.0.2"
certifi = "2025.11.12"
cffi = "2.0.0"
charset-normalizer = "3.4.4"
click = "8.3.1"
cloudpickle = "3.1.2"
colorama = "0.4.6"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.26",
    "langsmith>=0.8.5",
]
